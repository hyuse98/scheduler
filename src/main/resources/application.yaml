spring:
  application:
    name: scheduler

  flyway:
    enabled: true
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  datasource:
    url: jdbc:postgresql://localhost:5432/scheduler
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin

logging:
  level:
    root=WARN:
#  file:
#    name: scheduler_log.log

application:
  security:
    jwt:
      # Generate a key HMCA SHA-256 https://www.freeformatter.com/hmac-generator.html
      secret-key: d9293a62a650ed12c520a614587b831431aaa0e89b23280787331168d7725b65
      # Expiration time in  milliseconds (ex: 24 hours)
      expiration: 86400000

resilience4j:
  retry:
    instances:
      rabbitmq-retry:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - org.springframework.amqp.AmqpException
          - java.net.ConnectException